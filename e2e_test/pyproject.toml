[project]
name = "eduplan-e2e-artemis"
version = "1.0.0"
description = "E2E automated testing suite using Google ARTEMIS multimodal agent for EduPlan Flutter app"
authors = [{ name = "Nguyen Trong Hieu", email = "hieuntse180504@fpt.edu.vn" }]
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pydantic>=2.9.0",
    "google-genai>=0.1.1",
]

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
python_files = "test_*.py"
